<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-10cm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="55%" stop-color="#1C2D5A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <pattern id="grid-10cm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-10cm)" />
  <rect width="100%" height="100%" fill="url(#grid-10cm)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="170" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" />
  <text x="155" y="91" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">PORADNIK POMIARU</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Linijka 10 cm i 20 cm</text>
  <text x="70" y="215" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">Pozioma i pionowa skala</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Podziałka milimetrowa 1:1 dopasowana do ekranu</text>

  <!-- Left specs cards -->
  <g transform="translate(70, 310)">
    <rect width="180" height="60" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="20" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">SKALA POZIOMA</text>
    <text x="20" y="48" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">10 cm i 20 cm</text>
  </g>
  <g transform="translate(270, 310)">
    <rect width="180" height="60" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="20" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">SKALA PIONOWA</text>
    <text x="20" y="48" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Obrót 90°</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Bespoke Technical Illustration -->
  <!-- Main Display Plate -->
  <g transform="translate(500, 60)" filter="url(#shadow-card)">
    <!-- Plate backdrop -->
    <rect width="630" height="510" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Top Horizontal Ruler (0 to 20 cm representation) -->
    <g transform="translate(40, 40)">
      <rect width="550" height="90" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="90" x2="530" y2="90" stroke="#38BDF8" stroke-width="2" />
      
      <!-- Horizontal ticks: 0, 5, 10, 15, 20 cm -->
      <!-- 0 cm -->
      <line x1="30" y1="90" x2="30" y2="40" stroke="#FFFFFF" stroke-width="2" />
      <text x="30" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">0</text>
      <!-- mm ticks between 0 and 5 -->
      <line x1="55" y1="90" x2="55" y2="72" stroke="#64748B" stroke-width="1" />
      <line x1="80" y1="90" x2="80" y2="60" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="105" y1="90" x2="105" y2="72" stroke="#64748B" stroke-width="1" />
      <line x1="130" y1="90" x2="130" y2="72" stroke="#64748B" stroke-width="1" />
      
      <!-- 5 cm -->
      <line x1="155" y1="90" x2="155" y2="45" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="155" y="32" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5</text>
      
      <!-- 10 cm HIGHLIGHT (Key marker) -->
      <line x1="280" y1="90" x2="280" y2="35" stroke="#38BDF8" stroke-width="3" filter="url(#glow-blue)" />
      <text x="280" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">10 cm</text>
      
      <!-- mm ticks between 10 and 15 -->
      <line x1="305" y1="90" x2="305" y2="72" stroke="#64748B" stroke-width="1" />
      <line x1="330" y1="90" x2="330" y2="60" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="355" y1="90" x2="355" y2="72" stroke="#64748B" stroke-width="1" />
      <line x1="380" y1="90" x2="380" y2="72" stroke="#64748B" stroke-width="1" />
      
      <!-- 15 cm -->
      <line x1="405" y1="90" x2="405" y2="45" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="405" y="32" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">15</text>
      
      <!-- 20 cm HIGHLIGHT (Key marker) -->
      <line x1="530" y1="90" x2="530" y2="35" stroke="#38BDF8" stroke-width="3" filter="url(#glow-blue)" />
      <text x="530" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">20 cm</text>

      <!-- 10cm dimension span -->
      <line x1="30" y1="105" x2="280" y2="105" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="125" y="97" width="60" height="18" rx="4" fill="#1E3A8A" />
      <text x="155" y="111" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100 mm</text>
    </g>

    <!-- Vertical Ruler (Pionowa skala - 0 to 15 cm) -->
    <g transform="translate(40, 150)">
      <rect width="90" height="320" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="90" y1="20" x2="90" y2="300" stroke="#34D399" stroke-width="2" />
      
      <!-- Vertical ticks -->
      <line x1="90" y1="30" x2="40" y2="30" stroke="#FFFFFF" stroke-width="2" />
      <text x="25" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text>
      
      <line x1="90" y1="65" x2="70" y2="65" stroke="#64748B" stroke-width="1" />
      <line x1="90" y1="100" x2="55" y2="100" stroke="#94A3B8" stroke-width="1.5" />
      <text x="35" y="104" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">5</text>
      
      <line x1="90" y1="135" x2="70" y2="135" stroke="#64748B" stroke-width="1" />
      <line x1="90" y1="170" x2="40" y2="170" stroke="#34D399" stroke-width="2.5" />
      <text x="25" y="174" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">10</text>
      
      <line x1="90" y1="205" x2="70" y2="205" stroke="#64748B" stroke-width="1" />
      <line x1="90" y1="240" x2="55" y2="240" stroke="#94A3B8" stroke-width="1.5" />
      <text x="35" y="244" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">15</text>
      
      <line x1="90" y1="275" x2="70" y2="275" stroke="#64748B" stroke-width="1" />
    </g>

    <!-- Center Interactive Measurement Area & Rotation Diagram -->
    <g transform="translate(160, 180)">
      <!-- Measured Object (e.g. smartphone or card contour) -->
      <rect width="380" height="250" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4" />
      
      <!-- Rotation / Orientation Badge -->
      <circle cx="190" cy="110" r="44" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
      <!-- Rotation arrow icon -->
      <path d="M 175 100 A 22 22 0 1 1 205 118" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <polygon points="208,110 205,123 194,118" fill="#38BDF8" />
      <text x="190" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">90°</text>
      
      <text x="190" y="175" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Automatyczny obrót skali</text>
      <text x="190" y="198" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Pomiary poziome i pionowe bez obracania telefonu</text>
      
      <!-- Coordinate corner marker -->
      <circle cx="30" cy="30" r="4" fill="#38BDF8" />
      <text x="42" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Punkt 0,0</text>
    </g>
  </g>
</svg>