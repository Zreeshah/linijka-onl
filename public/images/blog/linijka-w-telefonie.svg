<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <pattern id="grid-phone" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-phone" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-phone)" />
  <rect width="100%" height="100%" fill="url(#grid-phone)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  <text x="160" y="91" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">PRZEWODNIK MOBILNY</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Linijka w telefonie</text>
  <text x="70" y="215" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">Pomiary smartfonem 1:1</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Jak zamienić ekran telefonu w dokładną miarkę</text>

  <!-- Feature callouts -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="20" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">✓ Tryb poziomy: maksymalna długość skali</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="20" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">✓ Pomiar bezpośrednio na powierzchni szkła</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Smartphone Measuring Physical Object (Brass Key) -->
  <g transform="translate(480, 50)" filter="url(#shadow-phone)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Pomiar przedmiotu przyłożonego do krawędzi ekranu</text>
    <text x="40" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Przyłóż przedmiot od lewej krawędzi (punkt 0) i odczytaj wartość</text>

    <!-- Landscape Smartphone Frame -->
    <g transform="translate(45, 95)">
      <!-- Phone Body Exterior -->
      <rect width="570" height="340" rx="36" fill="#1E293B" stroke="#475569" stroke-width="3" />
      
      <!-- Phone Bezel / Glass Area -->
      <rect x="25" y="20" width="520" height="300" rx="20" fill="#050B14" stroke="#334155" stroke-width="1.5" />
      
      <!-- Dynamic Island / Camera Notch on left edge (landscape) -->
      <rect x="35" y="145" width="8" height="50" rx="4" fill="#1E293B" />

      <!-- Active On-Screen Ruler along top edge -->
      <g transform="translate(55, 30)">
        <rect width="470" height="85" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
        <line x1="15" y1="85" x2="455" y2="85" stroke="#38BDF8" stroke-width="2" />
        
        <!-- Ruler markings: 0 to 8 cm -->
        <!-- 0 cm (Zero alignment mark) -->
        <line x1="30" y1="85" x2="30" y2="35" stroke="#FFFFFF" stroke-width="2.5" />
        <text x="30" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0</text>
        
        <!-- 1 cm -->
        <line x1="80" y1="85" x2="80" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">1</text>
        
        <!-- 2 cm -->
        <line x1="130" y1="85" x2="130" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="130" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">2</text>
        
        <!-- 3 cm -->
        <line x1="180" y1="85" x2="180" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="180" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3</text>
        
        <!-- 4 cm -->
        <line x1="230" y1="85" x2="230" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="230" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">4</text>
        
        <!-- 5 cm -->
        <line x1="280" y1="85" x2="280" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="280" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">5</text>
        
        <!-- 5.8 cm KEY MEASUREMENT ALIGNMENT (x = 320) -->
        <line x1="320" y1="85" x2="320" y2="28" stroke="#34D399" stroke-width="3" />
        <text x="320" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">5,8 cm</text>
        
        <!-- 6 cm -->
        <line x1="330" y1="85" x2="330" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="330" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">6</text>
        
        <!-- 7 cm -->
        <line x1="380" y1="85" x2="380" y2="48" stroke="#94A3B8" stroke-width="1.5" />
        <text x="380" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">7</text>
      </g>

      <!-- Physical Object on Screen: A Standard Brass House Key -->
      <g transform="translate(85, 155)">
        <!-- Projection alignment guides -->
        <line x1="0" y1="-40" x2="0" y2="70" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3" />
        <line x1="290" y1="-40" x2="290" y2="70" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 3" />

        <!-- Key Graphic (Brass Gold Metallic) -->
        <!-- Key Head / Bow -->
        <circle cx="50" cy="40" r="38" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
        <circle cx="50" cy="40" r="14" fill="#050B14" stroke="#B45309" stroke-width="2" />
        
        <!-- Key Blade / Shaft -->
        <rect x="80" y="28" width="210" height="24" rx="3" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
        
        <!-- Key Cuts / Bittings along bottom of blade -->
        <path d="M 120 52 L 140 60 L 160 52 L 180 62 L 200 54 L 220 64 L 250 52 L 290 52 L 290 28" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
        <!-- Key tip bevel -->
        <path d="M 275 28 L 290 40 L 290 52" fill="#FBBF24" stroke="#D97706" stroke-width="2" />

        <!-- Dimension indicator below key -->
        <g transform="translate(0, 95)">
          <line x1="0" y1="0" x2="290" y2="0" stroke="#34D399" stroke-width="2" />
          <line x1="0" y1="-8" x2="0" y2="8" stroke="#34D399" stroke-width="2" />
          <line x1="290" y1="-8" x2="290" y2="8" stroke="#34D399" stroke-width="2" />
          <rect x="85" y="-12" width="120" height="24" rx="4" fill="#0F172A" />
          <text x="145" y="4" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">długość = 58 mm</text>
        </g>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(45, 465)">
      <rect width="570" height="40" rx="8" fill="rgba(30, 41, 59, 0.7)" />
      <text x="25" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Wskazówka: Zdejmij grube etui z telefonu, aby przedmiot przylegał bezpośrednio do skali</text>
    </g>
  </g>
</svg>
