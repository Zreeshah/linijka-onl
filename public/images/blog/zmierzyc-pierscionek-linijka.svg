<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <pattern id="grid-ring" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-ring" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-ring)" />
  <rect width="100%" height="100%" fill="url(#grid-ring)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="180" height="32" rx="16" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.5" />
  <text x="160" y="91" fill="#FB7185" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">PORADNIK JUBILERSKI</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Jak zmierzyć pierścionek</text>
  <text x="70" y="215" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">linijką na ekranie</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Pomiar średnicy wewnętrznej i polska tabela rozmiarów</text>

  <!-- Rule badges -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.3)" />
    <text x="20" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">✓ Średnica wewnętrzna (od brzegu do brzegu)</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(239, 68, 68, 0.3)" />
    <text x="20" y="32" fill="#F87171" font-family="system-ui, sans-serif" font-size="15" font-weight="700">✕ BŁĄD: Nigdy nie mierz zewnętrznej krawędzi</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Ring Over Ruler Scale Diagram -->
  <g transform="translate(480, 50)" filter="url(#shadow-ring)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Prawidłowe ułożenie pierścionka na podziałce milimetrowej</text>
    <text x="40" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Wewnętrzna ścianka pierścionka musi stykać się z kreską 0 mm</text>

    <!-- Detailed Millimeter Ruler Under Ring -->
    <g transform="translate(40, 100)">
      <rect width="580" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="80" x2="560" y2="80" stroke="#38BDF8" stroke-width="2" />
      
      <!-- Ruler Ticks: 0 to 4 cm (Expanded scale for precision) -->
      <!-- 0 mm (Zero mark aligns with inner ring wall at x = 120) -->
      <line x1="120" y1="80" x2="120" y2="25" stroke="#38BDF8" stroke-width="3" />
      <text x="120" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0 mm</text>
      
      <!-- 5 mm -->
      <line x1="180" y1="80" x2="180" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="180" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">5</text>
      
      <!-- 10 mm (1 cm) -->
      <line x1="240" y1="80" x2="240" y2="35" stroke="#FFFFFF" stroke-width="2" />
      <text x="240" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">10</text>
      
      <!-- 15 mm -->
      <line x1="300" y1="80" x2="300" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="300" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">15</text>
      
      <!-- 16.51 mm KEY MEASUREMENT (Rozmiar 12 -> x = 318) -->
      <line x1="318" y1="80" x2="318" y2="25" stroke="#F43F5E" stroke-width="3" />
      <text x="318" y="20" fill="#FB7185" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">16,5 mm</text>
      
      <!-- 20 mm (2 cm) -->
      <line x1="360" y1="80" x2="360" y2="35" stroke="#FFFFFF" stroke-width="2" />
      <text x="360" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">20</text>
      
      <!-- 30 mm (3 cm) -->
      <line x1="480" y1="80" x2="480" y2="35" stroke="#FFFFFF" stroke-width="2" />
      <text x="480" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">30</text>
    </g>

    <!-- Realistic Gold Ring Illustration (Top-Down View) -->
    <g transform="translate(40, 200)">
      <!-- Projection Lines linking to ruler -->
      <line x1="120" y1="-20" x2="120" y2="230" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="318" y1="-20" x2="318" y2="230" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 3" />

      <!-- Center of ring is at x = 219, y = 110. Inner radius = 99px (16.5 mm), Outer radius = 125px -->
      <!-- Ring Outer Shadow & Body -->
      <circle cx="219" cy="110" r="125" fill="url(#gold-grad)" stroke="#92400E" stroke-width="2" />
      
      <!-- Ring Inner Hole (Screen shows through) -->
      <circle cx="219" cy="110" r="99" fill="#0F172A" stroke="#B45309" stroke-width="2" />

      <!-- Internal Diameter Dimension Arrow (Across the inside of the ring) -->
      <g transform="translate(0, 110)">
        <line x1="120" y1="0" x2="318" y2="0" stroke="#38BDF8" stroke-width="2.5" />
        <polygon points="120,0 132,-6 132,6" fill="#38BDF8" />
        <polygon points="318,0 306,-6 306,6" fill="#38BDF8" />
        
        <rect x="175" y="-14" width="90" height="28" rx="6" fill="#0B132B" stroke="#38BDF8" />
        <text x="220" y="5" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">d = 16,51 mm</text>
      </g>

      <!-- Outer Wall Thickness Warning -->
      <g transform="translate(325, 60)">
        <line x1="0" y1="0" x2="20" y2="0" stroke="#EF4444" stroke-width="2" />
        <text x="28" y="4" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Grubość ścianki (pomiń!)</text>
      </g>

      <!-- Ring Size Result Card (Right Side of Ring) -->
      <g transform="translate(380, 50)">
        <rect width="210" height="130" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5" />
        <text x="20" y="30" fill="#FB7185" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WYNIK Z TABELI:</text>
        <text x="20" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Rozmiar 12</text>
        <text x="20" y="90" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Obwód: 51,9 mm</text>
        <text x="20" y="112" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Standard jubilerski PL/EU</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(40, 475)">
      <rect width="580" height="35" rx="6" fill="rgba(30, 41, 59, 0.7)" />
      <text x="20" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Rada: Jeśli pomiar wypada pomiędzy kreskami (np. 16,6 mm), zawsze wybierz rozmiar większy.</text>
    </g>
  </g>
</svg>