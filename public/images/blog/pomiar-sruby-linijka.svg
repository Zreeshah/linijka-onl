<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <pattern id="grid-bolt" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-bolt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-bolt)" />
  <rect width="100%" height="100%" fill="url(#grid-bolt)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  <text x="160" y="91" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">RYSUNEK TECHNICZNY</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Pomiar śruby linijką</text>
  <text x="70" y="215" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">Śruby metryczne M3–M10</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Prawidłowy pomiar długości trzpienia i średnicy gwintu</text>

  <!-- Technical rule pills -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="20" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">✓ Długość L: mierzona BEZ łba śruby</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="20" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">! Wyjątek: wkręty stożkowe mierzy się z łbem</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Engineering Diagram of Metric Hex Bolt Measurement -->
  <g transform="translate(480, 50)" filter="url(#shadow-bolt)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Wymiarowanie śruby z łbem sześciokątnym (DIN 933 / ISO 4017)</text>
    <text x="40" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Podstawa łba musi idealnie pokrywać się z kreską zerową (0 mm)</text>

    <!-- Ruler Section Under Bolt -->
    <g transform="translate(40, 100)">
      <rect width="580" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="70" x2="560" y2="70" stroke="#38BDF8" stroke-width="2" />
      
      <!-- Ruler Ticks: 0 to 6 cm (0 mm aligns with bolt shoulder at x=140) -->
      <!-- Before 0: negative space where head rests -->
      <line x1="80" y1="70" x2="80" y2="52" stroke="#475569" stroke-width="1" />
      
      <!-- 0 mm (SHOULDER ZERO MARK) -->
      <line x1="140" y1="70" x2="140" y2="25" stroke="#38BDF8" stroke-width="3" />
      <text x="140" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0 mm</text>
      
      <!-- 10 mm -->
      <line x1="215" y1="70" x2="215" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="215" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">10</text>
      
      <!-- 20 mm -->
      <line x1="290" y1="70" x2="290" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="290" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">20</text>
      
      <!-- 30 mm -->
      <line x1="365" y1="70" x2="365" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="365" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">30</text>
      
      <!-- 40 mm (BOLT END ALIGNMENT) -->
      <line x1="440" y1="70" x2="440" y2="25" stroke="#34D399" stroke-width="3" />
      <text x="440" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">40 mm</text>
      
      <!-- 50 mm -->
      <line x1="515" y1="70" x2="515" y2="45" stroke="#94A3B8" stroke-width="1.5" />
      <text x="515" y="38" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">50</text>
    </g>

    <!-- Technical Bolt Drawing -->
    <g transform="translate(40, 190)">
      <!-- Projection Lines linking to ruler -->
      <line x1="140" y1="-20" x2="140" y2="150" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="440" y1="-20" x2="440" y2="150" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="80" y1="0" x2="80" y2="100" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3" />

      <!-- Bolt Hex Head (k = 60px wide, from x=80 to x=140, height=120px) -->
      <g transform="translate(80, 20)">
        <polygon points="0,15 60,0 60,100 0,85" fill="url(#steel-grad)" stroke="#1E293B" stroke-width="2" />
        <line x1="20" y1="10" x2="20" y2="90" stroke="#CBD5E1" stroke-width="1.5" />
        <line x1="40" y1="5" x2="40" y2="95" stroke="#64748B" stroke-width="1.5" />
      </g>

      <!-- Bolt Threaded Shank (L = 40 mm, x=140 to x=440, diameter d = 60px) -->
      <g transform="translate(140, 40)">
        <!-- Solid Shank Core -->
        <rect width="300" height="60" fill="url(#steel-grad)" stroke="#1E293B" stroke-width="2" />
        
        <!-- Thread Ridges (Metryczny gwint ISO M8) -->
        <g stroke="#334155" stroke-width="2">
          <line x1="20" y1="0" x2="30" y2="60" />
          <line x1="40" y1="0" x2="50" y2="60" />
          <line x1="60" y1="0" x2="70" y2="60" />
          <line x1="80" y1="0" x2="90" y2="60" />
          <line x1="100" y1="0" x2="110" y2="60" />
          <line x1="120" y1="0" x2="130" y2="60" />
          <line x1="140" y1="0" x2="150" y2="60" />
          <line x1="160" y1="0" x2="170" y2="60" />
          <line x1="180" y1="0" x2="190" y2="60" />
          <line x1="200" y1="0" x2="210" y2="60" />
          <line x1="220" y1="0" x2="230" y2="60" />
          <line x1="240" y1="0" x2="250" y2="60" />
          <line x1="260" y1="0" x2="270" y2="60" />
          <line x1="280" y1="0" x2="290" y2="60" />
        </g>

        <!-- Chamfer / Bevel at tip -->
        <polygon points="300,0 305,5 305,55 300,60" fill="#64748B" />
      </g>

      <!-- Dimension Line for Shank Length L = 40 mm -->
      <g transform="translate(140, 160)">
        <line x1="0" y1="0" x2="300" y2="0" stroke="#34D399" stroke-width="2" />
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#34D399" stroke-width="2" />
        <line x1="300" y1="-8" x2="300" y2="8" stroke="#34D399" stroke-width="2" />
        <rect x="75" y="-14" width="150" height="26" rx="4" fill="#0F172A" />
        <text x="150" y="4" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Długość L = 40 mm</text>
      </g>

      <!-- Dimension Line for Thread Diameter d (M8) -->
      <g transform="translate(460, 40)">
        <line x1="0" y1="0" x2="0" y2="60" stroke="#38BDF8" stroke-width="2" />
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#38BDF8" stroke-width="2" />
        <line x1="-8" y1="60" x2="8" y2="60" stroke="#38BDF8" stroke-width="2" />
        <text x="18" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">d = 8 mm (M8)</text>
      </g>

      <!-- Head Height Dimension (k) with DO NOT MEASURE indicator -->
      <g transform="translate(80, 160)">
        <line x1="0" y1="0" x2="60" y2="0" stroke="#EF4444" stroke-width="2" />
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#EF4444" stroke-width="2" />
        <line x1="60" y1="-8" x2="60" y2="8" stroke="#EF4444" stroke-width="2" />
        <text x="30" y="24" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Nie wliczaj łba!</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(40, 465)">
      <rect width="580" height="40" rx="8" fill="rgba(30, 41, 59, 0.7)" />
      <text x="20" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Oznaczenie handlowe: Śruba <tspan fill="#34D399" font-weight="700">M8 × 40 mm</tspan> (średnica nominalna 8 mm, długość użytkowa 40 mm)</text>
    </g>
  </g>
</svg>