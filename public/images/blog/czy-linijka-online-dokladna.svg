<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <pattern id="grid-acc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-acc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-acc)" />
  <rect width="100%" height="100%" fill="url(#grid-acc)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  <text x="160" y="91" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">BADANIE DOKŁADNOŚCI</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Czy linijka online</text>
  <text x="70" y="215" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">jest dokładna?</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Piksele ekranowe, PPI i granice tolerancji</text>

  <!-- Key parameters cards -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="20" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PO KALIBRACJI ID-1</text>
    <text x="20" y="44" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tolerancja odczytu: ±0,2 mm – 0,4 mm</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(239, 68, 68, 0.3)" />
    <text x="20" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PRZED KALIBRACJĄ (CSS 96 DPI)</text>
    <text x="20" y="44" fill="#F87171" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Błąd fabryczny: od 7% do 18%</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Loupe / Subpixel Precision Inspection Graphic -->
  <g transform="translate(480, 50)" filter="url(#shadow-acc)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Mikroskopowa analiza podziałki milimetrowej</text>
    <text x="40" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Fizyczna gęstość pikseli (PPI) a precyzja kreski pomiarowej</text>

    <!-- Base Ruler Under Inspection (Horizontal) -->
    <g transform="translate(40, 100)">
      <rect width="580" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="70" x2="560" y2="70" stroke="#38BDF8" stroke-width="2" />
      
      <!-- Ruler Ticks -->
      <line x1="40" y1="70" x2="40" y2="25" stroke="#FFFFFF" stroke-width="2" />
      <text x="40" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text>
      
      <line x1="85" y1="70" x2="85" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="130" y1="70" x2="130" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="175" y1="70" x2="175" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="220" y1="70" x2="220" y2="52" stroke="#64748B" stroke-width="1.5" />
      
      <!-- 1 cm (center of inspection) -->
      <line x1="265" y1="70" x2="265" y2="30" stroke="#38BDF8" stroke-width="2.5" />
      <text x="265" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1 cm</text>
      
      <line x1="310" y1="70" x2="310" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="355" y1="70" x2="355" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="400" y1="70" x2="400" y2="52" stroke="#64748B" stroke-width="1.5" />
      <line x1="445" y1="70" x2="445" y2="52" stroke="#64748B" stroke-width="1.5" />
      
      <line x1="490" y1="70" x2="490" y2="30" stroke="#FFFFFF" stroke-width="2" />
      <text x="490" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2 cm</text>
    </g>

    <!-- Inspection Magnifying Loupe Graphic (Looking at 1 cm tick) -->
    <g transform="translate(305, 170)">
      <!-- Projection Cones from ruler tick to loupe -->
      <polygon points="0,0 -160,80 160,80" fill="rgba(56, 189, 248, 0.08)" />
      
      <!-- Magnifier Glass Outer Frame -->
      <circle cx="0" cy="180" r="135" fill="#0B132B" stroke="#38BDF8" stroke-width="4" />
      
      <!-- Pixel Matrix Pattern inside the Loupe -->
      <g transform="translate(-110, 75)" opacity="0.85">
        <!-- Subpixel Grid (R G B strip simulation) -->
        <rect x="0" y="0" width="220" height="210" fill="#050B14" />
        
        <!-- Render detailed subpixel rows -->
        <!-- Row of screen subpixels -->
        <g stroke="#1E293B" stroke-width="1">
          <!-- Central Millimeter Tick projected on subpixels -->
          <rect x="98" y="20" width="24" height="170" fill="#38BDF8" opacity="0.9" />
          <line x1="110" y1="10" x2="110" y2="200" stroke="#FFFFFF" stroke-width="2" />
        </g>
        
        <!-- Crosshair & measurement reticle -->
        <line x1="0" y1="105" x2="220" y2="105" stroke="rgba(244, 63, 94, 0.6)" stroke-width="1.5" stroke-dasharray="4 3" />
        <line x1="110" y1="0" x2="110" y2="210" stroke="rgba(244, 63, 94, 0.8)" stroke-width="1.5" />
        
        <!-- Tolerance bracket -->
        <line x1="85" y1="150" x2="135" y2="150" stroke="#34D399" stroke-width="2" />
        <line x1="85" y1="143" x2="85" y2="157" stroke="#34D399" stroke-width="2" />
        <line x1="135" y1="143" x2="135" y2="157" stroke="#34D399" stroke-width="2" />
        <text x="110" y="142" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">±0,2 mm</text>
      </g>

      <!-- Glass reflection highlight -->
      <path d="M -90 120 A 120 120 0 0 1 80 80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" />

      <!-- Callout badge outside loupe -->
      <g transform="translate(145, 140)">
        <rect width="170" height="85" rx="8" fill="#1E293B" stroke="#475569" />
        <text x="15" y="25" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">460 PPI (Smartfon)</text>
        <text x="15" y="45" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">1 px ≈ 0,055 mm</text>
        <text x="15" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Szerokość kreski: 4 px</text>
      </g>
    </g>

    <!-- Bottom summary label -->
    <g transform="translate(40, 465)">
      <rect width="320" height="40" rx="8" fill="rgba(30, 41, 59, 0.7)" />
      <text x="20" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Klucz do dokładności: <tspan fill="#34D399" font-weight="700">Zoom przeglądarki dokładnie 100%</tspan></text>
    </g>
  </g>
</svg>