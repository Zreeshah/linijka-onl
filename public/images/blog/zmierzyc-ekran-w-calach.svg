<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <pattern id="grid-screen" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-screen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-screen)" />
  <rect width="100%" height="100%" fill="url(#grid-screen)" />

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  <text x="160" y="91" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">PRZEKĄTNA EKRANU</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1px">Jak zmierzyć ekran</text>
  <text x="70" y="215" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600">w calach?</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Pomiar przekątnej matrycy aktywnej bez ramek obudowy</text>

  <!-- Formula / Principle cards -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="20" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">WZÓR PITAGORASA</text>
    <text x="20" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">d = √(szerokość² + wysokość²)</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="20" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PRZELICZNIK NA CALE</text>
    <text x="20" y="44" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="16" font-weight="700">przekątna w cm ÷ 2,54 = cale (&quot;)</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Linijka.onl — Linijka online 1:1</text>

  <!-- RIGHT COLUMN: Monitor Diagonal Geometric Diagram -->
  <g transform="translate(480, 50)" filter="url(#shadow-screen)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="40" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Schemat pomiaru widocznego obszaru matrycy (16:9)</text>
    <text x="40" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Zmierz odległość od wewnętrznego rogu do rogu przeciwległego</text>

    <!-- Monitor Graphic with Stand -->
    <g transform="translate(50, 95)">
      <!-- Monitor Outer Casing (Bezel) -->
      <rect width="560" height="330" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2" />
      
      <!-- Monitor Stand / Base -->
      <path d="M 240 330 L 260 380 L 300 380 L 320 330" fill="#334155" stroke="#1E293B" />
      <rect x="200" y="380" width="160" height="12" rx="4" fill="#475569" />

      <!-- Active Display Area (Matryca aktywna) -->
      <rect x="25" y="25" width="510" height="280" rx="4" fill="#050B14" stroke="#38BDF8" stroke-width="1.5" />

      <!-- Outer Bezel Warning Indicators -->
      <g transform="translate(0, 0)">
        <text x="12" y="18" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700">NIE mierz ramki</text>
        <line x1="0" y1="0" x2="25" y2="25" stroke="#EF4444" stroke-width="1" />
      </g>

      <!-- Dimension Line Width (W = 59,8 cm) -->
      <g transform="translate(25, 312)">
        <line x1="0" y1="0" x2="510" y2="0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />
        <text x="255" y="16" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Szerokość matrycy: 59,8 cm</text>
      </g>

      <!-- Dimension Line Height (H = 33,6 cm) -->
      <g transform="translate(545, 25)">
        <line x1="0" y1="0" x2="0" y2="280" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />
        <text x="16" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" transform="rotate(90, 16, 145)">Wysokość: 33,6 cm</text>
      </g>

      <!-- DIAGONAL MEASUREMENT LINE (From bottom-left to top-right) -->
      <g transform="translate(25, 25)">
        <!-- Right Triangle Inset Shading -->
        <polygon points="0,280 510,280 510,0" fill="rgba(56, 189, 248, 0.05)" />
        
        <!-- Right angle symbol in bottom-right corner -->
        <rect x="490" y="260" width="20" height="20" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6" />

        <!-- Diagonal Vector Line -->
        <line x1="0" y1="280" x2="510" y2="0" stroke="#F59E0B" stroke-width="3.5" />
        <circle cx="0" cy="280" r="6" fill="#F59E0B" />
        <circle cx="510" cy="0" r="6" fill="#F59E0B" />

        <!-- Diagonal Measurement Badge in Center -->
        <g transform="translate(255, 140)">
          <rect x="-95" y="-30" width="190" height="60" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
          <text x="0" y="-8" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Przekątna: 27 cali</text>
          <text x="0" y="16" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">68,6 cm (dokładnie)</text>
        </g>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(50, 480)">
      <text x="0" y="15" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Popularne rozmiary: 24&quot; ≈ 61 cm • 27&quot; ≈ 69 cm • 32&quot; ≈ 81 cm • 55&quot; ≈ 140 cm</text>
    </g>
  </g>
</svg>